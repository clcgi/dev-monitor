[application]
name = "dev-monitor"
default_platform = "desktop"

[desktop]
title = "DEV Monitor"

[bundle]
identifier = "com.cdw.devmonitor"
# Required by `dx bundle`; shown to whoever installs the app.
publisher = "CDW"

icon = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]

[bundle.macos]
signing_identity = "-"

[web.app]
title = "DEV Monitor"
