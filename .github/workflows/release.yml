# Build the desktop bundles and attach them to a GitHub Release.
#
# WHY THIS RUNS IN CI AND NOT ON A LAPTOP. The Windows bundle cannot be produced
# from macOS: Dioxus desktop renders through the platform webview -- WebView2 on
# Windows, WKWebView on macOS -- so each target needs its own OS to link
# against. A matrix of two runners is the whole reason this file exists.
#
# Triggered by a TAG, never by a push to main. A release is a deliberate act,
# and tying it to main would mint one on every merge.

name: release

on:
  push:
    tags: ['v*']
  # Manual runs build the bundles WITHOUT publishing, so the packaging can be
  # checked without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  bundle:
    strategy:
      # Never cancel the other OS because one failed: knowing that macOS built
      # and Windows did not is the useful outcome, and fail-fast hides it.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
            artifact: dev-monitor-macos
            # macos-latest is Apple silicon.
            dx_asset: dx-aarch64-apple-darwin-v0.6.3.tar.gz
          - os: windows-latest
            package: nsis
            artifact: dev-monitor-windows
            dx_asset: dx-x86_64-pc-windows-msvc-v0.6.3.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Caches the APP's compiled dependencies. It no longer has a CLI install
      # to cache -- that is a download now -- but `dx bundle --release` still
      # compiles dioxus, tokio and the rest into the workspace target dir, and
      # that is the slow half of a cold run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # DOWNLOADED, NOT COMPILED, and that is the whole point of this step.
      #
      # `cargo install dioxus-cli` builds the CLI's entire dependency tree on
      # the runner, and that tree is not ours to fix. Two failures came out of
      # it on 2026-09-01, neither caused by anything in this repository:
      #
      #   swc_common 5.0.0 -> `serde::__private`, removed after serde 1.0.216
      #   aws-lc-sys 0.23.1 -> "couldn't determine visual studio generator"
      #
      # The second is the one that settles the approach: aws-lc-sys needs CMake
      # with an MSVC generator and NASM, so making it build means installing a C
      # toolchain on the runner to compile a tool we only ever use as a binary.
      # Dioxus publishes that binary. Use it.
      #
      # The archives hold a single executable at the root -- `dx` / `dx.exe` --
      # verified against the v0.6.3 assets.
      # DOWNLOADED, NOT COMPILED, and that is the whole point of this step.
      #
      # `cargo install dioxus-cli` builds the CLI's entire dependency tree on
      # the runner, and that tree is not ours to fix. Two failures came out of
      # it on 2026-09-01, neither caused by anything in this repository:
      #
      #   swc_common 5.0.0 -> `serde::__private`, removed after serde 1.0.216
      #   aws-lc-sys 0.23.1 -> "couldn't determine visual studio generator"
      #
      # The second settles the approach: aws-lc-sys needs CMake with an MSVC
      # generator and NASM, so making it build means installing a C toolchain on
      # the runner to compile a tool we only ever use as a binary. Dioxus
      # publishes that binary. It also took 15 minutes on macOS.
      #
      # THE CHECKSUM ASSET REPLACES THE EXTENSION, IT DOES NOT APPEND TO IT:
      #
      #   dx-aarch64-apple-darwin-v0.6.3.tar.gz     <- archive
      #   dx-aarch64-apple-darwin-v0.6.3.sha256     <- checksum, NOT .tar.gz.sha256
      #
      # Getting that wrong cost a full run on 2026-09-01. The archive downloaded
      # and the checksum 404'd, and because a 404 says nothing about which of
      # two URLs produced it, it read as the release assets being unreachable
      # from the runner. They were reachable the whole time.
      #
      # Fetched with `gh` rather than `curl`: it is preinstalled on
      # GitHub-hosted runners, sends the job's token, and resolves assets BY
      # NAME against the release. That last part is why it stays -- a name that
      # matches nothing is now visible as a missing file below instead of an
      # HTTP status with no subject.
      #
      # `gh release download` EXITS 0 WHEN A --pattern MATCHES NOTHING, as long
      # as some other pattern matched, so the `ls` is the actual guard.
      #
      # The archives hold a single executable at the root -- `dx` / `dx.exe` --
      # verified against the v0.6.3 assets.
      - name: Install the Dioxus CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_VERSION: v0.6.3
          DX_ASSET: ${{ matrix.dx_asset }}
        run: |
          set -euo pipefail
          # Strip .tar.gz or .zip, then add .sha256 -- see the note above.
          DX_SHA="${DX_ASSET%.tar.gz}"
          DX_SHA="${DX_SHA%.zip}.sha256"
          echo "archive:  $DX_ASSET"
          echo "checksum: $DX_SHA"

          gh release download "$DX_VERSION" \
            --repo DioxusLabs/dioxus \
            --pattern "$DX_ASSET" \
            --pattern "$DX_SHA" \
            --clobber
          ls -la "$DX_ASSET" "$DX_SHA"

          # CHECKSUM VERIFIED. This binary is fetched over the network and then
          # executed, so an unverified download is an unverified executable --
          # and a truncated one fails later, inside the bundler, as something
          # that looks like a bundling bug.
          # The checksum file names the archive, so this runs from the same
          # directory the archive was downloaded into.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$DX_SHA"
          else
            shasum -a 256 -c "$DX_SHA"
          fi

          DX_BIN="$HOME/.dx-bin"
          mkdir -p "$DX_BIN"
          case "$DX_ASSET" in
            *.tar.gz) tar xzf "$DX_ASSET" -C "$DX_BIN" ;;
            *.zip)    unzip -q "$DX_ASSET" -d "$DX_BIN" ;;
          esac
          chmod +x "$DX_BIN"/dx* || true

          # TRANSLATED TO A NATIVE PATH ON WINDOWS. This step runs in Git Bash,
          # where $HOME is `/c/Users/runneradmin` -- a POSIX path PowerShell
          # cannot resolve. Later steps run in pwsh, the default shell on
          # windows runners, so writing the POSIX form to GITHUB_PATH put an
          # entry there that only bash could use: `dx` was on PATH for a bash
          # step and missing for the bundle step, which failed with "The term
          # 'dx' is not recognized" as though it had never been installed.
          if command -v cygpath >/dev/null; then
            DX_BIN="$(cygpath -w "$DX_BIN")"
          fi
          echo "adding to PATH: $DX_BIN"
          echo "$DX_BIN" >> "$GITHUB_PATH"

      # NO `shell:` HERE, DELIBERATELY. This runs in the job's DEFAULT shell --
      # pwsh on windows runners -- which is the shell the bundle step uses. The
      # previous version forced bash, so it confirmed `dx` was reachable from a
      # shell nothing else used and passed while the bundle step could not find
      # the binary at all. A guard that checks a different environment from the
      # one it is guarding is worse than no guard: it converts a clear failure
      # into a confusing one further down.
      - name: Check dx runs, in the shell the bundle will use
        run: dx --help

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # assets/tailwind.css IS committed -- the app builds with nothing but
      # Rust, by design. It is rebuilt here anyway so a release can never ship a
      # stylesheet that disagrees with the markup in the same commit, which is a
      # difference nothing else would report.
      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run build:css

      # `dmg` produces a .dmg, `nsis` produces an .exe -- verified against the
      # PackageType enum in dioxus-cli 0.6.3. `msi` is the other Windows option
      # and is deliberately not used: NSIS gives a plain installer executable,
      # which is what people expect behind a "download for Windows" link.
      #
      # --out-dir makes the destination OURS. Without it the bundle lands in a
      # CLI-version-dependent path (`dist/`, later `target/dx/<name>/bundle/`),
      # and a wrong guess fails as "no files found" -- which reads as a build
      # that produced nothing rather than a path that moved.
      - name: Bundle
        run: dx bundle --release --platform desktop --package-types ${{ matrix.package }} --out-dir bundle

      # Searched under our own --out-dir first, then the whole tree as a
      # fallback, because the CLI copies into out-dir but has not always done so
      # for every package type. Then ASSERTED: a release job that uploads
      # nothing and still goes green is the failure this whole file exists to
      # avoid, and an empty Release page is only discovered by a user.
      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p out
          for root in bundle target dist; do
            [ -d "$root" ] || continue
            find "$root" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
              -exec cp -n {} out/ \; 2>/dev/null || true
          done
          echo "--- collected ---"; ls -la out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::dx bundle produced no ${{ matrix.package }} artifact"
            echo "--- tree, to find where it went ---"
            find bundle target dist -maxdepth 6 -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app' \) 2>/dev/null | head -40
            exit 1
          fi

      # The artifact must be the RIGHT KIND. A macOS job that somehow uploaded
      # only an .exe would still satisfy "something was produced".
      - name: Check the expected extension is present
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            dmg)  ls out/*.dmg >/dev/null 2>&1 || { echo "::error::no .dmg"; exit 1; } ;;
            nsis) ls out/*.exe >/dev/null 2>&1 || { echo "::error::no .exe"; exit 1; } ;;
          esac
          echo "ok: $(ls out)"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  publish:
    # Only a tag publishes. A manual run stops after `bundle`, leaving the
    # artifacts downloadable from the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — the `.dmg` is **unsigned**, so Gatekeeper refuses it on a
            double-click with "damaged and can't be opened". That message is
            wrong; the download is fine. Open it once with:

            ```
            xattr -dr com.apple.quarantine /Applications/dev-monitor.app
            ```

            **Windows** — SmartScreen shows "unrecognised app" for the same
            reason. *More info* → *Run anyway*.

            ## It needs the CDW checkout beside it

            This app runs the scripts in `CentralDocumentWarehouse/tools/`. It
            finds them **relative to its working directory**, so it must be
            launched from a tree that looks like:

            ```
            CDW/
            ├── CentralDocumentWarehouse/
            └── dev-monitor/
            ```

            Launched from anywhere else the sidebar reads "No scripts found in
            tools/". It also needs the Azure CLI on PATH and the repo's Python
            venv, and it loads its icon font from the network.
