# Build the desktop bundles and attach them to a GitHub Release.

name: release

on:
  push:
    tags: ['v*']
  # Manual runs build the bundles WITHOUT publishing, so the packaging can be.
  workflow_dispatch:

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  bundle:
    strategy:
      # Never cancel the other OS because one failed: knowing that macOS built.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
            artifact: dev-monitor-macos
            # macos-latest is Apple silicon.
            dx_asset: dx-aarch64-apple-darwin-v0.6.3.tar.gz
          - os: windows-latest
            package: nsis
            artifact: dev-monitor-windows
            dx_asset: dx-x86_64-pc-windows-msvc-v0.6.3.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Caches the APP's compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # DOWNLOADED, NOT COMPILED, and that is the whole point of this step.
      - name: Install the Dioxus CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_VERSION: v0.6.3
          DX_ASSET: ${{ matrix.dx_asset }}
        run: |
          set -euo pipefail
          # Strip .tar.gz or .zip, then add .sha256 -- see the note above.
          DX_SHA="${DX_ASSET%.tar.gz}"
          DX_SHA="${DX_SHA%.zip}.sha256"
          echo "archive:  $DX_ASSET"
          echo "checksum: $DX_SHA"

          gh release download "$DX_VERSION" \
            --repo DioxusLabs/dioxus \
            --pattern "$DX_ASSET" \
            --pattern "$DX_SHA" \
            --clobber
          ls -la "$DX_ASSET" "$DX_SHA"

          # CHECKSUM VERIFIED. This binary is fetched over the network and then.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$DX_SHA"
          else
            shasum -a 256 -c "$DX_SHA"
          fi

          DX_BIN="$HOME/.dx-bin"
          mkdir -p "$DX_BIN"
          case "$DX_ASSET" in
            *.tar.gz) tar xzf "$DX_ASSET" -C "$DX_BIN" ;;
            *.zip)    unzip -q "$DX_ASSET" -d "$DX_BIN" ;;
          esac
          chmod +x "$DX_BIN"/dx* || true

          # TRANSLATED TO A NATIVE PATH ON WINDOWS. This step runs in Git Bash, where.
          if command -v cygpath >/dev/null; then
            DX_BIN="$(cygpath -w "$DX_BIN")"
          fi
          echo "adding to PATH: $DX_BIN"
          echo "$DX_BIN" >> "$GITHUB_PATH"

      # NO `shell:` HERE, DELIBERATELY. This runs in the job's DEFAULT shell.
      - name: Check dx runs, in the shell the bundle will use
        run: dx --help

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # assets/tailwind.css IS committed -- the app builds with nothing but Rust.
      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run build:css

      # `dmg` produces a .dmg, `nsis` an .exe. Verified against dioxus-cli 0.6.3.
      # Signing is configured in Dioxus.toml, NOT here: dx reads bundler settings
      # from that file and ignores APPLE_SIGNING_IDENTITY entirely.
      - name: Bundle
        run: dx bundle --release --platform desktop --package-types ${{ matrix.package }} --out-dir bundle

      # One artifact per job. An earlier version also searched `target/`, which on
      # Windows holds an .exe for every build script, and attached 40 files to the
      # Release.
      - name: Collect the bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            dmg)  ext=dmg ;;
            nsis) ext=exe ;;
            msi)  ext=msi ;;
            *)    echo "::error::unhandled package type ${{ matrix.package }}"; exit 1 ;;
          esac

          echo "--- everything under bundle/ ---"
          find bundle -type f 2>/dev/null | head -40 || true

          # The bundler stages the RAW APPLICATION EXECUTABLE beside the
          # installer, so on Windows `bundle/**/*.exe` matches both
          # `dev-monitor.exe` and the NSIS installer. Prefer the package-type
          # subdirectory the bundler writes (`bundle/nsis/`, `bundle/dmg/`),
          # which holds only the finished installer, and fall back to a flat
          # out-dir if a future CLI stops nesting.
          mkdir -p out
          for dir in "bundle/${{ matrix.package }}" bundle; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f -name "*.${ext}" -exec cp {} out/ \; 2>/dev/null || true
            [ -n "$(ls -A out)" ] && break
          done

          echo "--- collected ---"; ls -la out
          count=$(ls -1 out | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::no .${ext} found under bundle/"
            exit 1
          fi
          # More than one means something that is not the installer matched, and
          # it would ship to the Release page.
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .${ext}, found ${count}"
            exit 1
          fi
          echo "ok: $(ls out)"

      # SIGNING, and the shape of this step is taken from the GitAgent project,
      # which ships a notarized build of the same kind of app.
      - name: Sign the macOS bundle
        if: matrix.package == 'dmg'
        shell: bash
        env:
          SIGNING_IDENTITY:      ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_KEY:         ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls out/*.dmg)"

          # All four, or none. A half-configured signing setup fails deep inside
          # codesign or notarytool with a message about the missing piece and
          # nothing about the configuration.
          REAL_SIGNING=false
          if [ -n "${SIGNING_IDENTITY:-}" ] && [ -n "${MACOS_CERTIFICATE:-}" ] \
             && [ -n "${MACOS_CERTIFICATE_PWD:-}" ] && [ -n "${KEYCHAIN_PASSWORD:-}" ]; then
            REAL_SIGNING=true
          fi
          echo "signing mode: $([ "$REAL_SIGNING" = true ] && echo 'Developer ID' || echo 'ad-hoc')"

          if [ "$REAL_SIGNING" = true ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm "$RUNNER_TEMP/cert.p12"
          fi

          # The dmg the bundler produced is read-only and compressed, so the app
          # inside cannot be signed in place. Converting preserves what the
          # bundler made -- the Applications symlink and the volume icon --
          # which rebuilding the image by hand would lose.
          hdiutil convert "$dmg" -format UDRW -o "$RUNNER_TEMP/rw.dmg"
          hdiutil attach "$RUNNER_TEMP/rw.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/rw"
          app="$(ls -d "$RUNNER_TEMP"/rw/*.app)"

          # --deep so the nested binaries are covered. --options runtime and
          # --timestamp ONLY with a real identity: the hardened runtime is what
          # notarization requires, and a timestamp needs a certificate authority
          # that an ad-hoc signature does not have.
          if [ "$REAL_SIGNING" = true ]; then
            codesign --force --deep --options runtime --timestamp \
              --entitlements .github/macos-entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

          hdiutil detach "$RUNNER_TEMP/rw" -quiet
          rm -f "$dmg"
          hdiutil convert "$RUNNER_TEMP/rw.dmg" -format UDZO -o "$dmg"

          if [ "$REAL_SIGNING" = true ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"

            if [ -n "${APP_STORE_KEY:-}" ] && [ -n "${APP_STORE_KEY_ID:-}" ] \
               && [ -n "${APP_STORE_ISSUER_ID:-}" ]; then
              P8="$RUNNER_TEMP/AuthKey_${APP_STORE_KEY_ID}.p8"
              echo "$APP_STORE_KEY" | base64 --decode > "$P8"
              # Notarizing the DMG covers the app inside it by hash. Stapling
              # writes the ticket into the file, so a first launch works offline.
              xcrun notarytool submit "$dmg" --key "$P8" \
                --key-id "$APP_STORE_KEY_ID" --issuer "$APP_STORE_ISSUER_ID" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              rm -f "$P8"
            else
              echo "::warning::signed but NOT notarized -- users will see one Gatekeeper prompt"
            fi
          fi

          # Re-verified from the FINAL artifact. Signing the app and repacking
          # the image are two operations, and only the second produces what
          # ships -- checking the first proves nothing about the file uploaded.
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/final"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/final/*.app
          hdiutil detach "$RUNNER_TEMP/final" -quiet
          echo "verified: $dmg"

      - name: Clean up the signing keychain
        if: always() && matrix.package == 'dmg'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  publish:
    # Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — the app is ad-hoc signed but **not notarized**, so
            macOS asks once. Open the `.dmg`, drag **DevMonitor** to
            Applications, then either:

            ```
            xattr -dr com.apple.quarantine /Applications/DevMonitor.app
            ```

            or launch it once and go to *System Settings → Privacy & Security*,
            where a message about DevMonitor offers **Open Anyway**.

            Run the command **after** copying to Applications — running it on
            the copy inside the mounted disk image changes nothing, because the
            image is read-only and you launch the copy.

            If you see *"is damaged and can't be opened"*, that message is
            misleading: the download is fine, macOS is refusing an app it cannot
            verify.

            **Windows** — SmartScreen shows "unrecognised app" for the same
            reason. *More info* → *Run anyway*.

            ## It needs the CDW checkout beside it

            This app runs the scripts in `CentralDocumentWarehouse/tools/`. It
            finds them **relative to its working directory**, so it must be
            launched from a tree that looks like:

            ```
            CDW/
            ├── CentralDocumentWarehouse/
            └── dev-monitor/
            ```

            Launched from anywhere else the sidebar reads "No scripts found in
            tools/". It also needs the Azure CLI on PATH and the repo's Python
            venv, and it loads its icon font from the network.
