# Build the desktop bundles and attach them to a GitHub Release.

name: release

on:
  push:
    tags: ['v*']
  # Manual runs build the bundles WITHOUT publishing, so the packaging can be.
  workflow_dispatch:

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  bundle:
    strategy:
      # Never cancel the other OS because one failed: knowing that macOS built.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
            artifact: dev-monitor-macos
            # macos-latest is Apple silicon.
            dx_asset: dx-aarch64-apple-darwin-v0.6.3.tar.gz
          - os: windows-latest
            package: nsis
            artifact: dev-monitor-windows
            dx_asset: dx-x86_64-pc-windows-msvc-v0.6.3.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Caches the APP's compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # DOWNLOADED, NOT COMPILED, and that is the whole point of this step.
      - name: Install the Dioxus CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_VERSION: v0.6.3
          DX_ASSET: ${{ matrix.dx_asset }}
        run: |
          set -euo pipefail
          # Strip .tar.gz or .zip, then add .sha256 -- see the note above.
          DX_SHA="${DX_ASSET%.tar.gz}"
          DX_SHA="${DX_SHA%.zip}.sha256"
          echo "archive:  $DX_ASSET"
          echo "checksum: $DX_SHA"

          gh release download "$DX_VERSION" \
            --repo DioxusLabs/dioxus \
            --pattern "$DX_ASSET" \
            --pattern "$DX_SHA" \
            --clobber
          ls -la "$DX_ASSET" "$DX_SHA"

          # CHECKSUM VERIFIED. This binary is fetched over the network and then.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$DX_SHA"
          else
            shasum -a 256 -c "$DX_SHA"
          fi

          DX_BIN="$HOME/.dx-bin"
          mkdir -p "$DX_BIN"
          case "$DX_ASSET" in
            *.tar.gz) tar xzf "$DX_ASSET" -C "$DX_BIN" ;;
            *.zip)    unzip -q "$DX_ASSET" -d "$DX_BIN" ;;
          esac
          chmod +x "$DX_BIN"/dx* || true

          # TRANSLATED TO A NATIVE PATH ON WINDOWS. This step runs in Git Bash, where.
          if command -v cygpath >/dev/null; then
            DX_BIN="$(cygpath -w "$DX_BIN")"
          fi
          echo "adding to PATH: $DX_BIN"
          echo "$DX_BIN" >> "$GITHUB_PATH"

      # NO `shell:` HERE, DELIBERATELY. This runs in the job's DEFAULT shell.
      - name: Check dx runs, in the shell the bundle will use
        run: dx --help

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # assets/tailwind.css IS committed -- the app builds with nothing but Rust.
      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run build:css

      # `dmg` produces a .dmg, `nsis` an .exe. Verified against dioxus-cli 0.6.3.
      # AD-HOC SIGNED ON macOS. Apple Silicon refuses to execute an unsigned
      # binary that came from the internet, and reports it as "DevMonitor.app is
      # damaged and can't be opened" -- which reads as a corrupt download and
      # sends people back to re-download a file that was never the problem.
      #
      # `-` is tauri-bundler's pseudo-identity for an ad-hoc signature. It costs
      # nothing and needs no Apple account. It does NOT notarize: the first
      # launch still has to be approved once, see the release notes.
      #
      # Ignored on Windows, so it stays unconditional rather than adding a
      # matrix field that exists for one runner.
      - name: Bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: dx bundle --release --platform desktop --package-types ${{ matrix.package }} --out-dir bundle

      # One artifact per job. An earlier version also searched `target/`, which on
      # Windows holds an .exe for every build script, and attached 40 files to the
      # Release.
      - name: Collect the bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            dmg)  ext=dmg ;;
            nsis) ext=exe ;;
            msi)  ext=msi ;;
            *)    echo "::error::unhandled package type ${{ matrix.package }}"; exit 1 ;;
          esac

          echo "--- everything under bundle/ ---"
          find bundle -type f 2>/dev/null | head -40 || true

          # The bundler stages the RAW APPLICATION EXECUTABLE beside the
          # installer, so on Windows `bundle/**/*.exe` matches both
          # `dev-monitor.exe` and the NSIS installer. Prefer the package-type
          # subdirectory the bundler writes (`bundle/nsis/`, `bundle/dmg/`),
          # which holds only the finished installer, and fall back to a flat
          # out-dir if a future CLI stops nesting.
          mkdir -p out
          for dir in "bundle/${{ matrix.package }}" bundle; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f -name "*.${ext}" -exec cp {} out/ \; 2>/dev/null || true
            [ -n "$(ls -A out)" ] && break
          done

          echo "--- collected ---"; ls -la out
          count=$(ls -1 out | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::no .${ext} found under bundle/"
            exit 1
          fi
          # More than one means something that is not the installer matched, and
          # it would ship to the Release page.
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .${ext}, found ${count}"
            exit 1
          fi
          echo "ok: $(ls out)"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  publish:
    # Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — the app is ad-hoc signed but **not notarized**, so
            macOS asks once. Open the `.dmg`, drag **DevMonitor** to
            Applications, then either:

            ```
            xattr -dr com.apple.quarantine /Applications/DevMonitor.app
            ```

            or launch it once and go to *System Settings → Privacy & Security*,
            where a message about DevMonitor offers **Open Anyway**.

            Run the command **after** copying to Applications — running it on
            the copy inside the mounted disk image changes nothing, because the
            image is read-only and you launch the copy.

            If you see *"is damaged and can't be opened"*, that message is
            misleading: the download is fine, macOS is refusing an app it cannot
            verify.

            **Windows** — SmartScreen shows "unrecognised app" for the same
            reason. *More info* → *Run anyway*.

            ## It needs the CDW checkout beside it

            This app runs the scripts in `CentralDocumentWarehouse/tools/`. It
            finds them **relative to its working directory**, so it must be
            launched from a tree that looks like:

            ```
            CDW/
            ├── CentralDocumentWarehouse/
            └── dev-monitor/
            ```

            Launched from anywhere else the sidebar reads "No scripts found in
            tools/". It also needs the Azure CLI on PATH and the repo's Python
            venv, and it loads its icon font from the network.
