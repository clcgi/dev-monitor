name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
            artifact: dev-monitor-macos
            dx_asset: dx-aarch64-apple-darwin-v0.6.3.tar.gz
          - os: windows-latest
            package: nsis
            artifact: dev-monitor-windows
            dx_asset: dx-x86_64-pc-windows-msvc-v0.6.3.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Downloaded, not compiled: dioxus-cli pulls aws-lc-sys, which needs CMake
      # and NASM on Windows.
      - name: Install the Dioxus CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_VERSION: v0.6.3
          DX_ASSET: ${{ matrix.dx_asset }}
        run: |
          set -euo pipefail
          # The checksum asset REPLACES the extension (...v0.6.3.sha256), and `gh`
          # exits 0 when a --pattern matches nothing -- so the `ls` is the guard.
          DX_SHA="${DX_ASSET%.tar.gz}"
          DX_SHA="${DX_SHA%.zip}.sha256"
          echo "archive:  $DX_ASSET"
          echo "checksum: $DX_SHA"

          gh release download "$DX_VERSION" \
            --repo DioxusLabs/dioxus \
            --pattern "$DX_ASSET" \
            --pattern "$DX_SHA" \
            --clobber
          ls -la "$DX_ASSET" "$DX_SHA"

          if command -v sha256sum >/dev/null; then
            sha256sum -c "$DX_SHA"
          else
            shasum -a 256 -c "$DX_SHA"
          fi

          DX_BIN="$HOME/.dx-bin"
          mkdir -p "$DX_BIN"
          case "$DX_ASSET" in
            *.tar.gz) tar xzf "$DX_ASSET" -C "$DX_BIN" ;;
            *.zip)    unzip -q "$DX_ASSET" -d "$DX_BIN" ;;
          esac
          chmod +x "$DX_BIN"/dx* || true

          # pwsh cannot resolve Git Bash's /c/Users/... form, and later steps use it.
          if command -v cygpath >/dev/null; then
            DX_BIN="$(cygpath -w "$DX_BIN")"
          fi
          echo "adding to PATH: $DX_BIN"
          echo "$DX_BIN" >> "$GITHUB_PATH"

      # No `shell:` -- must match Bundle's, or it guards nothing.
      - name: Check dx runs, in the shell the bundle will use
        run: dx --help

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Rebuilt so a release cannot ship CSS that disagrees with its markup.
      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run build:css

      # Signing lives in Dioxus.toml; dx ignores APPLE_SIGNING_IDENTITY.
      - name: Bundle
        run: dx bundle --release --platform desktop --package-types ${{ matrix.package }} --out-dir bundle

      # One artifact per job. Searching target/ once attached 40 files.
      - name: Collect the bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            dmg)  ext=dmg ;;
            nsis) ext=exe ;;
            msi)  ext=msi ;;
            *)    echo "::error::unhandled package type ${{ matrix.package }}"; exit 1 ;;
          esac

          echo "--- everything under bundle/ ---"
          find bundle -type f 2>/dev/null | head -40 || true

          # The raw executable sits beside the installer, so any *.exe matches
          # two files. The package-type subdirectory holds only the installer.
          mkdir -p out
          for dir in "bundle/${{ matrix.package }}" bundle; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f -name "*.${ext}" -exec cp {} out/ \; 2>/dev/null || true
            [ -n "$(ls -A out)" ] && break
          done

          echo "--- collected ---"; ls -la out
          count=$(ls -1 out | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::no .${ext} found under bundle/"
            exit 1
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .${ext}, found ${count}"
            exit 1
          fi
          orig="$(ls out)"
          renamed="$(echo "$orig" | sed -E 's/_(aarch64|arm64|x64|x86_64|universal)//')"
          if [ "$orig" != "$renamed" ]; then
            mv "out/$orig" "out/$renamed"
            echo "renamed: $orig -> $renamed"
          fi
          echo "ok: $(ls out)"

      # dx leaves the bundle INVALIDLY signed: the linker ad-hoc signs the
      # executable and declares a _CodeSignature the bundler never writes, which
      # macOS reports as "damaged". Developer ID + notarization when secrets exist.
      - name: Sign the macOS bundle
        if: matrix.package == 'dmg'
        shell: bash
        env:
          SIGNING_IDENTITY:      ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_KEY:         ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls out/*.dmg)"

          REAL_SIGNING=false
          if [ -n "${SIGNING_IDENTITY:-}" ] && [ -n "${MACOS_CERTIFICATE:-}" ] \
            && [ -n "${MACOS_CERTIFICATE_PWD:-}" ] && [ -n "${KEYCHAIN_PASSWORD:-}" ]; then
            REAL_SIGNING=true
          fi
          echo "signing mode: $([ "$REAL_SIGNING" = true ] && echo 'Developer ID' || echo 'ad-hoc')"

          if [ "$REAL_SIGNING" = true ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm "$RUNNER_TEMP/cert.p12"
          fi

          # Read-only, so signing in place is impossible. Converting keeps the
          # Applications symlink and volume icon a rebuilt image would lose.
          hdiutil convert "$dmg" -format UDRW -o "$RUNNER_TEMP/rw.dmg"
          hdiutil attach "$RUNNER_TEMP/rw.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/rw"
          app="$(ls -d "$RUNNER_TEMP"/rw/*.app)"

          # runtime + timestamp need a real certificate; ad-hoc has neither.
          if [ "$REAL_SIGNING" = true ]; then
            codesign --force --deep --options runtime --timestamp \
              --entitlements .github/macos-entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

          hdiutil detach "$RUNNER_TEMP/rw" -quiet
          rm -f "$dmg"
          hdiutil convert "$RUNNER_TEMP/rw.dmg" -format UDZO -o "$dmg"

          if [ "$REAL_SIGNING" = true ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"

            if [ -n "${APP_STORE_KEY:-}" ] && [ -n "${APP_STORE_KEY_ID:-}" ] \
               && [ -n "${APP_STORE_ISSUER_ID:-}" ]; then
              P8="$RUNNER_TEMP/AuthKey_${APP_STORE_KEY_ID}.p8"
              echo "$APP_STORE_KEY" | base64 --decode > "$P8"
              xcrun notarytool submit "$dmg" --key "$P8" \
                --key-id "$APP_STORE_KEY_ID" --issuer "$APP_STORE_ISSUER_ID" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              rm -f "$P8"
            else
              echo "::warning::signed but NOT notarized -- users will see one Gatekeeper prompt"
            fi
          fi

          # Verified from the FINAL artifact: repacking happens after signing.
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/final"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/final/*.app
          hdiutil detach "$RUNNER_TEMP/final" -quiet
          echo "verified: $dmg"

      - name: Clean up the signing keychain
        if: always() && matrix.package == 'dmg'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — the app is ad-hoc signed but **not notarized**, so
            macOS asks once. Open the `.dmg`, drag **DevMonitor** to
            Applications, then either:

            ```
            xattr -dr com.apple.quarantine /Applications/DevMonitor.app
            ```

            or launch it once and go to *System Settings → Privacy & Security*,
            where a message about DevMonitor offers **Open Anyway**.

            Run the command **after** copying to Applications — running it on
            the copy inside the mounted disk image changes nothing, because the
            image is read-only and you launch the copy.

            If you see *"is damaged and can't be opened"*, that message is
            misleading: the download is fine, macOS is refusing an app it cannot
            verify.

            **Windows** — SmartScreen shows "unrecognised app" for the same
            reason. *More info* → *Run anyway*.

            ## It needs the CDW checkout beside it

            This app runs the scripts in `CentralDocumentWarehouse/tools/`. It
            finds them **relative to its working directory**, so it must be
            launched from a tree that looks like:

            ```
            CDW/
            ├── CentralDocumentWarehouse/
            └── dev-monitor/
            ```

            Launched from anywhere else the sidebar reads "No scripts found in
            tools/". It also needs the Azure CLI on PATH and the repo's Python
            venv.
