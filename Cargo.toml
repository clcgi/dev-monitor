[package]
name = "dev-monitor"
version = "0.5.0"
edition = "2021"
description = "Monitor and test DEV ingestion workflow"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dark-light = "1"
futures-util = "0.3"

# The update check, and the TLS choice behind it is deliberate.
#
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Opens the release page in the user's browser. Tiny, and the alternative is
# shelling out to `open`/`start` per platform, which this crate is.
open = "5"

# The per-user config directory for steps.json.
dirs = "5"

# Shrink the debug target dir: keep file:line for readable backtraces, drop the
# heavier variable/type debug info only a step-debugger needs, and none of us do.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies never get debugged here, so drop their debug info entirely.
[profile.dev.package."*"]
debug = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
